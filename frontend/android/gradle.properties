org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 2.4.0 incremental compilation double-registers its cache storage under
# Gradle 9.3.1, failing every build with
#   IllegalStateException: Storage for [...class-fq-name-to-source.tab] is already registered
# It reproduces from a clean tree, so it is not stale-cache debris. Only :app and
# image_picker_android compile Kotlin here, so losing incrementality costs little.
# Revisit when the Kotlin Gradle plugin is next upgraded.
kotlin.incremental=false
