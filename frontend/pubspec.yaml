name: palm_hills_assistant
description: Palm Hills resident assistant - regulations, fines, facilities and contacts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Deliberately few dependencies: one HTTP client, one file picker. State is
  # plain ValueNotifier/InheritedWidget - the app is not complex enough to earn
  # a state-management package, and the backend holds all the real logic.
  http: ^1.2.2
  # Used directly for the multipart MediaType on evidence uploads.
  http_parser: ^4.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
